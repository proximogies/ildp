version: '3.9'

services:
  ildp-postgres:
    image: postgres:16-alpine
    container_name: ildp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ildp_user
      POSTGRES_PASSWORD: ildp_pass
      POSTGRES_DB: ildp_db
    ports:
      - "5434:5432"
    volumes:
      - ildp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ildp_user -d ildp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ildp_pgdata:
